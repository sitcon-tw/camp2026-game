info:
  contact: {}
  description: Backend API for the SITCON Camp 2026 game.
  title: Camp 2026 Game API
  version: 0.1.0
paths:
  /admin/community-stand-claims:
    get:
      description: Admin-only endpoint. Returns recent community stand claim records,
        including claimant, stand, reward snapshot, and claim time.
      parameters:
      - description: Filter by community stand ID
        in: query
        name: standId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.CommunityStandClaimsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: List community stand claim records as admin
      tags:
      - admin
  /admin/community-stands:
    get:
      description: Admin-only endpoint. Returns all community stands, including disabled
        stands, with counters and editable settings.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.CommunityStandsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: List community stands as admin
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Admin-only endpoint. Creates a community stand with display settings,
        enablement, and reward settings.
      parameters:
      - description: Community stand create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.CreateCommunityStandRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.CommunityStandResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: Create a community stand as admin
      tags:
      - admin
  /admin/community-stands/{standID}:
    delete:
      description: Admin-only endpoint. Deletes a community stand and clears its visit
        and claim counters.
      parameters:
      - description: Community stand ID
        in: path
        name: standID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: Delete a community stand as admin
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Admin-only endpoint. Updates display settings, enablement, and
        reward settings for a community stand.
      parameters:
      - description: Community stand ID
        in: path
        name: standID
        required: true
        type: string
      - description: Community stand update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateCommunityStandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.CommunityStandResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: Update a community stand as admin
      tags:
      - admin
  /admin/dashboard:
    get:
      description: Returns an admin-only operational dashboard with player, inventory,
        match, and activity statistics.
      produces:
