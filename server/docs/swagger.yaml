        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.AddRoomTeamMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AddRoomTeamMemberResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.AddRoomTeamMemberResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "404":
