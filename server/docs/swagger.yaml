        in: query
        name: bucket
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.DashboardHistoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: Get admin resource history
      tags:
      - admin
  /admin/inventory-trims:
    post:
      consumes:
      - application/json
      description: Admin-only endpoint. Selects the top N leaderboard players, removes
        sitones and open power, then notifies affected players.
      parameters:
      - description: Inventory trim request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.CreateInventoryTrimRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.CreateInventoryTrimResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.CreateInventoryTrimResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: Trim top player inventory
      tags:
      - admin
  /admin/login:
    post:
      consumes:
      - application/json
      description: Uses the ADMIN_PASSWORD environment variable to create an admin
        session cookie.
      parameters:
      - description: Admin login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: Login as admin
      tags:
      - admin
  /admin/logout:
    post:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Logout admin session
      tags:
      - admin
  /admin/open-power-transfers:
    get:
      description: Admin-only endpoint. Returns recent same-team open power transfers
        with sender, recipient, and team metadata.
      parameters:
      - description: Maximum number of transfer records to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.OpenPowerTransfersResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ProblemDetails'
      summary: List open power transfers as admin
      tags:
      - admin
  /admin/players/{playerID}/balance:
    put:
      consumes:
      - application/json
      description: Admin-only endpoint. Sets one player's total sitone count and open
        power to target values, then notifies the player.
      parameters:
      - description: Player ID
        in: path
        name: playerID
        required: true
